name: Offline zip

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build zip
        run: python3 scripts/package_offline_zip.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-veteran-pathways-toolkit-offline
          path: dist/open-veteran-pathways-toolkit-offline.zip
          if-no-files-found: error
      - name: Attach the zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/open-veteran-pathways-toolkit-offline.zip
