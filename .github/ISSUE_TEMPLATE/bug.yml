name: Bug
description: A page, rule, or offline cache does not do what it says
title: "fix: "
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Name the page and the control. Do not include classified information, CUI, health information, or a real Social Security number.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
