<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Pathway Translator — Open Veteran Pathways Toolkit</title>
  <style>
    :root { --navy: #0A0A0E; --teal: #12A594; --magenta: #DD368A; --paper: #F7F5F0; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--paper); color: var(--navy); line-height: 1.5; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem; }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .sub { color: #444; margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    input, textarea, button { font: inherit; width: 100%; box-sizing: border-box; }
    input, textarea { padding: 0.65rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 0.75rem; background: var(--magenta); color: white; border: none; padding: 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { background: #c02d78; }
    .result { margin-top: 1.5rem; background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 1rem; }
    .path { margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #eee; }
    .path:last-child { border-bottom: none; }
    .badge { display: inline-block; font-size: 0.75rem; background: var(--teal); color: white; padding: 0.15rem 0.4rem; border-radius: 4px; margin-left: 0.5rem; }
    footer { margin-top: 2rem; font-size: 0.8rem; color: #666; }
    a { color: var(--teal); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Career Pathway Translator</h1>
    <p class="sub">Offline military-to-civilian pathways. Enter your MOS, AFSC, or Rating. No account. Data stays on your device.</p>

    <form id="form">
      <label for="code">MOS / AFSC / Rating</label>
      <input id="code" name="code" placeholder="e.g. 11B, 68W, HM, 2A5X1" required autocomplete="off">
      <button type="submit">Translate</button>
    </form>

    <div id="output"></div>

    <footer>
      Open Veteran Pathways Toolkit · The AI Cowboys Foundation<br>
      MIT License · Offline-first · Private by default<br>
      <a href="https://theaicowboysfoundation.org/learn/mos-to-ceo">Full MOS to CEO Translator on the Foundation site</a>
    </footer>
  </div>

  <script>
    // Sample Foundation-aligned pathways (expandable). Full 33k+ Debriefed-style dictionary can be loaded later.
    const PATHWAYS = {
      "11B": {
        title: "Infantryman",
        paths: [
          { role: "Security Consulting", bullets: ["Led small-unit tactics and risk assessment under pressure", "Trained teams on operational security and force protection", "Managed logistics and accountability for equipment and personnel"] },
          { role: "Project Coordination", bullets: ["Coordinated multi-person operations with clear timelines and contingencies", "Translated complex orders into executable team actions", "Documented after-action reviews and process improvements"] },
          { role: "Field Operations Management", bullets: ["Supervised teams in dynamic environments", "Maintained readiness standards and equipment accountability", "Communicated status to higher command clearly and accurately"] }
        ]
      },
      "68W": {
        title: "Combat Medic",
        paths: [
          { role: "Mobile Urgent Care / EMS", bullets: ["Provided emergency medical care in austere environments", "Triaged patients and stabilized for higher-level care", "Maintained detailed medical documentation under time pressure"] },
          { role: "Clinical Coordination", bullets: ["Coordinated care across providers and facilities", "Educated patients and families on treatment plans", "Managed medical supplies and inventory accountability"] },
          { role: "Healthcare Training", bullets: ["Trained non-medical personnel in basic lifesaving skills", "Developed and delivered medical readiness instruction", "Evaluated trainee performance and documented certifications"] }
        ]
      },
      "HM": {
        title: "Hospital Corpsman",
        paths: [
          { role: "Medical Staffing / Clinic Support", bullets: ["Delivered patient care in clinical and operational settings", "Managed medical records and privacy requirements", "Supported providers with accurate patient preparation and follow-up"] },
          { role: "Healthcare Administration", bullets: ["Tracked patient flow and resource utilization", "Ensured compliance with medical standards and regulations", "Coordinated between clinical teams and support staff"] },
          { role: "Community Health Outreach", bullets: ["Educated populations on preventive care", "Organized medical readiness events", "Documented health metrics for unit reporting"] }
        ]
      }
    };

    const form = document.getElementById('form');
    const output = document.getElementById('output');
    const codeInput = document.getElementById('code');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const code = codeInput.value.trim().toUpperCase();
      const data = PATHWAYS[code];

      if (!data) {
        output.innerHTML = `<div class="result"><p>No exact match for <strong>${code}</strong> in this offline sample. Try 11B, 68W, or HM, or use the full <a href="https://theaicowboysfoundation.org/learn/mos-to-ceo">MOS to CEO Translator</a> on the Foundation site.</p></div>`;
        return;
      }

      let html = `<div class="result"><h2>${data.title} <span class="badge">${code}</span></h2>`;
      data.paths.forEach((p, i) => {
        html += `<div class="path"><h3>${i + 1}. ${p.role}</h3><ul>`;
        p.bullets.forEach(b => { html += `<li>${b}</li>`; });
        html += `</ul></div>`;
      });
      html += `<p style="margin-top:1rem;font-size:0.9rem;">Next steps: Review the full <a href="https://theaicowboysfoundation.org/learn/ai-guide">AI Guide</a> and <a href="https://theaicowboysfoundation.org/learn/open-veteran-pathways">Open Veteran Pathways Toolkit</a>.</p></div>`;
      output.innerHTML = html;

      // Optional localStorage for user history (private by default)
      try {
        const history = JSON.parse(localStorage.getItem('pathway-history') || '[]');
        history.unshift({ code, title: data.title, ts: Date.now() });
        localStorage.setItem('pathway-history', JSON.stringify(history.slice(0, 10)));
      } catch (e) {}
    });
  </script>
</body>
</html>
